<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      #start-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 9999;
        padding: 15px 25px;
        font-size: 18px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <button id="start-btn">Iniciar Cámara AR</button>

    <!-- Agregamos filterMinCF y filterBeta para suavizar el rastreo y eliminar vibraciones -->
<a-scene mindar-image="imageTargetSrc: ./targets.mind; uiLoading: yes; filterMinCF: 0.0001; filterBeta: 0.001;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  
  <a-assets>
    <!-- Asegúrate de cambiar 'tu-video.mp4' por el nombre real de tu video en GitHub -->
    <video id="miVideo" src="./tu-video.mp4" preload="auto" loop crossorigin="anonymous" webkit-playsinline playsinline></video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <!-- height="0.872" para tu imagen de 1340x1168 -->
    <a-video src="#miVideo" width="1" height="0.872" position="0 0 0" rotation="0 0 0"></a-video>
  </a-entity>
</a-scene>

    <script>
  const btn = document.getElementById('start-btn');
  const video = document.getElementById('miVideo');

  btn.addEventListener('click', () => {
    btn.style.display = 'none';

    // 1. Silenciamos el video antes de la prueba
    video.muted = true;
    
    // 2. Hacemos un reprodujo/pausa relámpago para desbloquear el permiso móvil
    video.play().then(() => {
      video.pause();
      video.currentTime = 0; // Regresar al segundo 0
      video.muted = false;   // Quitar el silencio para cuando detecte la foto
    }).catch(err => {
      console.log("Error desbloqueando medio:", err);
      video.muted = false;
    });
  });

  const target = document.querySelector('[mindar-image-target]');

  // Inicia video Y audio ÚNICAMENTE al enfocar la foto
  target.addEventListener("targetFound", () => {
    video.play().catch(err => console.log("Error al reproducir:", err));
  });

  // Pausa y reinicia si quitas la cámara de la foto
  target.addEventListener("targetLost", () => {
    video.pause();
    video.currentTime = 0;
  });
</script>
  </body>
</html>
